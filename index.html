  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      /* Fundo azul-marinho escuro e profundo */
      background: radial-gradient(circle at center, #071526 0%, #02060d 100%);
      color: #00d2ff;
      /* Azul Ciano Tecnológico */
      font-family: Verdana, Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }

    /* Efeito de grade sutil no fundo em tom azulado */
    body::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-image:
        linear-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
      background-size: 30px 30px;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 2;
      animation: fadeIn 1.5s ease-out;
    }

    /* Estrutura do Loader Tecnológico */
    .loader-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
      margin: 0 auto 30px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid transparent;
    }

    /* Anel externo (Azul Ciano) */
    .ring:nth-child(1) {
      width: 120px;
      height: 120px;
      border-top: 2px solid #00d2ff;
      border-bottom: 2px solid #00d2ff;
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
      animation: spin 2s linear infinite;
    }

    /* Anel do meio (Azul Elétrico mais profundo) */
    .ring:nth-child(2) {
      width: 90px;
      height: 90px;
      border-left: 2px solid #0055ff;
      border-right: 2px solid #0055ff;
      box-shadow: 0 0 10px rgba(0, 85, 255, 0.4);
      animation: spin-reverse 1.5s linear infinite;
    }

    /* Núcleo interno (Pulsante e brilhante) */
    .ring:nth-child(3) {
      width: 40px;
      height: 40px;
      background: rgba(0, 210, 255, 0.15);
      border: 2px solid #00d2ff;
      box-shadow: 0 0 20px #00d2ff;
      animation: pulse 1s ease-in-out infinite alternate;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      text-shadow: 0 0 12px rgba(0, 210, 255, 0.8);
      font-weight: normal;
    }

    /* Cursor de terminal piscando */
    h1::after {
      content: '█';
      margin-left: 5px;
      color: #00d2ff;
      animation: blink 1s step-start infinite;
    }

    p {
      font-size: 12px;
      opacity: 0.8;
      letter-spacing: 1.5px;
      color: #8ab4f8;
      /* Azul claro para contraste e legibilidade */
      text-transform: uppercase;
    }

    /* Animações */
    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes spin-reverse {
      0% {
        transform: rotate(360deg);
      }

      100% {
        transform: rotate(0deg);
      }
    }

    @keyframes pulse {
      0% {
        transform: scale(0.8);
        opacity: 0.5;
      }

      100% {
        transform: scale(1.1);
        opacity: 1;
      }
    }

    @keyframes blink {
      50% {
        opacity: 0;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        filter: blur(10px);
        transform: scale(0.9);
      }

      to {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
    }
  </style>
